<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spin That Dice">
<meta name="theme-color" content="#08080A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Spin That Dice</title>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Karla:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --bg:#08080A; --panel:#101014; --panel-2:#16161C; --line:#24242C;
  --text:#F2F0EC; --dim:#8B8890; --accent:#F2A03D; --accent-ink:#141014; --bad:#E2503C;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:Karla,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.5; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 70% 45% at 50% 0%, rgba(242,160,61,.13), transparent 70%);
  background-repeat:no-repeat; background-attachment:fixed;
  display:flex; flex-direction:column; align-items:center;
  padding:max(18px,env(safe-area-inset-top)) 18px calc(48px + env(safe-area-inset-bottom));
  -webkit-user-select:none; user-select:none; overscroll-behavior:none;
}
.wrap{width:100%; max-width:620px; text-align:center; display:flex; flex-direction:column; align-items:center}
.eyebrow{font-family:"Space Mono",ui-monospace,monospace; font-size:10.5px; letter-spacing:.26em;
  text-transform:uppercase; color:var(--dim); margin:0; min-height:1.3em}
h1{font-family:Anton,Impact,sans-serif; font-weight:400; margin:.22em 0 0;
  font-size:clamp(38px,10.5vw,66px); line-height:.9; text-transform:uppercase}
h1 em{font-style:normal; color:var(--accent)}

.die{
  --s:clamp(160px,44vw,230px);
  width:var(--s); height:var(--s); margin:clamp(26px,6vh,48px) 0 0;
  border-radius:22%; cursor:pointer; position:relative; border:none;
  padding:calc(var(--s) * .13);
  background:linear-gradient(157deg,#FDFCFA 0%,#E4E0D8 48%,#C9C4B9 100%);
  box-shadow:0 2px 0 rgba(255,255,255,.6) inset, 0 -10px 22px rgba(0,0,0,.18) inset,
             0 26px 50px -12px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.5),
             0 0 60px -12px rgba(242,160,61,.4);
  display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:6%;
  transition:transform .16s cubic-bezier(.34,1.56,.64,1);
}
.die:active{transform:translateY(2px) scale(.97)}
.die:focus-visible{outline:2px solid var(--accent); outline-offset:6px}
.pip{width:88%; aspect-ratio:1; align-self:center; justify-self:center;
  border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#3A3A42,#0A0A0C 70%);
  box-shadow:0 1px 1px rgba(255,255,255,.45); opacity:0; transition:opacity .08s}
.pip.on{opacity:1}
@keyframes tumble{0%{transform:rotate(0) scale(1)}25%{transform:rotate(-16deg) scale(1.06)}
  50%{transform:rotate(14deg) scale(.95)}75%{transform:rotate(-8deg) scale(1.04)}100%{transform:rotate(0) scale(1)}}
.die.rolling{animation:tumble .5s ease-in-out}
.hint{font-family:"Space Mono",monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--dim); margin:16px 0 0}
.hint b{color:var(--accent); font-weight:400}

.lane{margin:22px 0 0; display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.chip{font-family:"Space Mono",monospace; font-size:12px; background:var(--panel); color:var(--text);
  border:1px solid var(--line); border-radius:999px; padding:10px 16px; cursor:pointer; transition:.14s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700}
.chip[disabled]{opacity:.3; cursor:default}
.more{color:var(--dim); text-decoration:underline; text-underline-offset:3px; background:none; border:none;
  font-family:"Space Mono",monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  cursor:pointer; margin-top:16px; padding:8px}
.all{display:none; margin:14px 0 0; padding:16px; background:var(--panel); border:1px solid var(--line);
  border-radius:14px; gap:7px; flex-wrap:wrap; justify-content:center}
.all.open{display:flex}
.all .chip{font-size:11.5px; padding:8px 13px}

.plate{width:100%; margin:26px 0 0; background:var(--panel); border:1px solid var(--line);
  border-radius:16px; padding:20px; text-align:left; display:none}
.plate.show{display:block; animation:rise .32s ease}
@keyframes rise{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
.tagrow{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.tag{font-family:"Space Mono",monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase;
  background:var(--accent); color:var(--accent-ink); padding:4px 9px; border-radius:4px; font-weight:700}
.meta{font-family:"Space Mono",monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--dim); border:1px solid var(--line); padding:3px 8px; border-radius:4px}
.track{font-family:Anton,Impact,sans-serif; font-size:clamp(23px,5.4vw,32px); line-height:1.06;
  text-transform:uppercase; margin:0}
.artist{color:var(--dim); margin:5px 0 0; font-size:15px}
.embed{width:100%; min-height:80px; border-radius:12px; margin-top:15px; display:block; overflow:hidden}
.embed iframe{border:0; border-radius:12px; display:block; width:100%}
.audio{width:100%; margin-top:15px; border-radius:12px}
.err{color:var(--bad); font-size:14px; margin:0}
footer{margin-top:30px; color:#5C5A62; font-size:11px; font-family:"Space Mono",monospace; letter-spacing:.1em}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow" id="eyebrow">warming up…</p>
  <h1>Spin That <em>Dice</em></h1>

  <div class="die" id="die" role="button" tabindex="0" aria-label="Roll the die">
    <span class="pip"></span><span class="pip"></span><span class="pip"></span>
    <span class="pip"></span><span class="pip"></span><span class="pip"></span>
    <span class="pip"></span><span class="pip"></span><span class="pip"></span>
  </div>
  <p class="hint" id="hint">tap the die — <b>anything</b></p>

  <div class="lane" id="lane"></div>
  <button class="more" id="spBtn" hidden></button>
  <button class="more" id="moreBtn" aria-expanded="false">All categories</button>
  <div class="all" id="all"></div>

  <div class="plate" id="plate">
    <div class="tagrow"><span class="tag" id="pCat"></span><span class="meta" id="pYear"></span><span class="meta" id="pHave"></span></div>
    <p class="track" id="pTrack"></p>
    <p class="artist" id="pArtist"></p>
    <div class="embed" id="player"></div>
    <audio class="audio" id="audio" controls hidden></audio>
    <p class="err" id="pErr" hidden></p>
  </div>
  <footer id="foot"></footer>
</div>

<script>
const FACES={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const die=document.getElementById('die'), pips=[...die.querySelectorAll('.pip')];
const hint=document.getElementById('hint'), lane=document.getElementById('lane');
const all=document.getElementById('all'), plate=document.getElementById('plate');
const eyebrow=document.getElementById('eyebrow'), foot=document.getElementById('foot');
const moreBtn=document.getElementById('moreBtn');
const spBtn=document.getElementById('spBtn');

let CATS=[], busy=false;
// multi-select: an empty set means "anything", otherwise roll across the chosen lanes
let picks=new Set();
const PK='spin.lanes';
try{ (JSON.parse(localStorage.getItem(PK)||'[]')||[]).forEach(c=>picks.add(c)); }catch(e){}
let STATIC=null;   // set when there is no /api (static build): {cat: [tracks]}
const audio=document.getElementById('audio'), player=document.getElementById('player');
const pCat=document.getElementById('pCat'), pYear=document.getElementById('pYear'),
      pHave=document.getElementById('pHave'), pTrack=document.getElementById('pTrack'),
      pArtist=document.getElementById('pArtist'), pErr=document.getElementById('pErr');

// Spotify's iFrame API: one controller, reloaded each roll, so we can call play().
// A plain <iframe> per roll can never autoplay - nothing to call play() on.
let sp=null, spReady=false, pending=null;
window.onSpotifyIframeApiReady = (API) => {
  API.createController(document.getElementById('player'),
    {width:'100%', height:80, uri:''},
    (ctrl)=>{
      sp=ctrl; spReady=true;
      ctrl.addListener('ready',()=>{ try{ ctrl.play(); }catch(e){} });
      if(pending){ const u=pending; pending=null; playUri(u); }
    });
};
function playUri(uri){
  if(!spReady||!sp){ pending=uri; return; }
  try{
    sp.loadUri(uri);
    // 'ready' covers most cases; this catches the ones where it has already fired
    setTimeout(()=>{ try{ sp.play(); }catch(e){} }, 350);
  }catch(e){}
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const face=n=>pips.forEach((p,i)=>p.classList.toggle('on',FACES[n].includes(i)));

// ---------------------------------------------------------------- spotify pkce
// Optional. Set spotify_client_id in config.json and add this page's URL as a
// redirect URI on the Spotify app. No secret lives here - PKCE is built for
// public clients. Once connected, a roll plays on whatever Spotify device is
// already awake (the tablet's own Spotify app, a speaker, anything).
// Still needs Premium, and the app's Development Mode caps it at 5 accounts.
const SP='spin.sp';
let spCfg='', spTok=null;
const store={
  get(){ try{ return JSON.parse(localStorage.getItem(SP)||'null'); }catch(e){ return null; } },
  set(v){ try{ localStorage.setItem(SP,JSON.stringify(v)); }catch(e){} },
  clear(){ try{ localStorage.removeItem(SP); }catch(e){} }
};
const b64url=b=>btoa(String.fromCharCode(...new Uint8Array(b)))
  .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function challenge(v){ return b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v))); }
const redirectUri=()=>location.origin+location.pathname;

async function spConnect(){
  const verifier=b64url(crypto.getRandomValues(new Uint8Array(48)));
  sessionStorage.setItem('spin.v',verifier);
  const q=new URLSearchParams({client_id:spCfg, response_type:'code',
    redirect_uri:redirectUri(), code_challenge_method:'S256',
    code_challenge:await challenge(verifier),
    scope:'user-modify-playback-state user-read-playback-state'});
  location.href='https://accounts.spotify.com/authorize?'+q;
}
async function spExchange(code){
  const verifier=sessionStorage.getItem('spin.v')||'';
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({client_id:spCfg, grant_type:'authorization_code',
      code, redirect_uri:redirectUri(), code_verifier:verifier})});
  if(!r.ok) throw new Error('token exchange failed');
  const j=await r.json();
  store.set({at:j.access_token, rt:j.refresh_token, exp:Date.now()+(j.expires_in-60)*1000});
}
async function spToken(){
  let t=store.get();
  if(!t) return null;
  if(Date.now()<t.exp) return t.at;
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({client_id:spCfg, grant_type:'refresh_token', refresh_token:t.rt})});
  if(!r.ok){ store.clear(); spPaint(); return null; }
  const j=await r.json();
  t={at:j.access_token, rt:j.refresh_token||t.rt, exp:Date.now()+(j.expires_in-60)*1000};
  store.set(t); return t.at;
}
function spPaint(){
  if(!spCfg){ spBtn.hidden=true; return; }
  spBtn.hidden=false;
  spBtn.textContent=store.get()?'Spotify connected':'Connect Spotify';
  spBtn.onclick=()=>{ if(store.get()){ store.clear(); spPaint(); } else spConnect(); };
}
// returns true if it played on a real device
async function spPlay(id){
  const at=await spToken();
  if(!at) return false;
  const r=await fetch('https://api.spotify.com/v1/me/player/play',{method:'PUT',
    headers:{Authorization:'Bearer '+at,'Content-Type':'application/json'},
    body:JSON.stringify({uris:['spotify:track:'+id]})});
  if(r.status===204) return true;
  if(r.status===404) hint.innerHTML='open Spotify on a device first';   // no active device
  if(r.status===403) hint.innerHTML='spotify says premium required';
  return false;
}

// keep the iPad awake through a party
let wl=null;
async function keepAwake(){
  try{ if('wakeLock' in navigator && !wl){ wl=await navigator.wakeLock.request('screen');
    wl.addEventListener('release',()=>{wl=null;}); } }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') keepAwake(); });

function paintPicks(){
  document.querySelectorAll('.chip').forEach(b=>{
    const on = b.dataset.c==='any' ? picks.size===0 : picks.has(b.dataset.c);
    b.setAttribute('aria-pressed', String(on));
  });
  const n=picks.size;
  hint.innerHTML = n===0 ? 'tap the die — <b>anything</b>'
    : n===1 ? 'tap the die — <b>'+esc([...picks][0])+'</b>'
    : 'tap the die — <b>'+n+' lanes</b>';
  try{ localStorage.setItem(PK, JSON.stringify([...picks])); }catch(e){}
}
function togglePick(c){
  if(c==='any') picks.clear();
  else if(picks.has(c)) picks.delete(c);
  else picks.add(c);
  paintPicks();
}
function rollCat(){
  const chosen=[...picks];
  return chosen.length ? chosen[Math.floor(Math.random()*chosen.length)] : 'any';
}
function chip(name,have){
  const b=document.createElement('button');
  b.className='chip'; b.dataset.c=name; b.textContent=name;
  if(have===0){ b.disabled=true; b.title='still filling'; }   // -1 = unknown, still playable
  b.onclick=()=>{ togglePick(name); };   // pick lanes freely, then roll when ready
  return b;
}

async function loadMeta(){
  // Served by spin.py? use the live API. Static build? read the baked index.
  try{
    const r=await fetch('api/categories');
    if(r.ok) return await r.json();
  }catch(e){}
  const idx=await (await fetch('index.json')).json();
  STATIC=idx.cats;
  return {blocked_min:0, built:idx.built,
          cats:Object.keys(idx.cats).map(n=>({name:n, have:idx.cats[n].length}))};
}

async function boot(){
  try{ spCfg=(await (await fetch('config.json')).json()).spotify_client_id||''; }catch(e){}
  const code=new URLSearchParams(location.search).get('code');
  if(code && spCfg){
    try{ await spExchange(code); }catch(e){}
    history.replaceState({},'',redirectUri());       // keep the URL clean
  }
  try{
    const meta=await loadMeta();
    CATS=meta.cats;
    const top=[...CATS].filter(c=>c.have!==0).sort((a,b)=>b.have-a.have).slice(0,6);
    lane.append(chip('any'), ...top.map(c=>chip(c.name,c.have)));
    all.append(...CATS.map(c=>chip(c.name,c.have)));
    const known=new Set(CATS.map(c=>c.name));
    [...picks].forEach(c=>{ if(!known.has(c)) picks.delete(c); });
    if(meta.provider){
      eyebrow.textContent=CATS.length+' genres from your '+meta.provider+' library';
    }else{
      const total=CATS.reduce((n,c)=>n+c.have,0), ready=CATS.filter(c=>c.have).length;
      eyebrow.textContent=total+' tracks indexed · '+ready+' of '+CATS.length+' categories ready';
    }
    foot.textContent=STATIC
      ? 'crate built '+(meta.built||'').slice(0,10)
      : (meta.blocked_min
          ? 'catalogue top-up paused '+Math.floor(meta.blocked_min/60)+'h'+String(meta.blocked_min%60).padStart(2,'0')+'m · rolls unaffected'
          : 'the crate fills itself in the background');
  }catch(e){
    eyebrow.textContent='could not reach the roll service';
    plate.className='plate show'; plate.innerHTML='<p class="err">API unreachable: '+esc(e.message)+'</p>';
  }
  paintPicks();
  spPaint();
  face(5);
}

moreBtn.onclick=()=>{
  const open=all.classList.toggle('open');
  moreBtn.setAttribute('aria-expanded',String(open));
  moreBtn.textContent=open?'Hide categories':'All categories';
};

async function roll(){
  if(busy) return; busy=true; keepAwake();
  die.classList.add('rolling');
  const shuffle=setInterval(()=>face(1+Math.floor(Math.random()*6)),70);
  const settle=new Promise(r=>setTimeout(r,520));
  try{
    let d;
    if(STATIC){
      await settle;
      d=staticRoll(rollCat());
    }else{
      const [res]=await Promise.all([fetch('api/roll?cat='+encodeURIComponent(rollCat())),settle]);
      d=await res.json();
      if(!res.ok||d.error) throw new Error(d.error||('HTTP '+res.status));
    }
    clearInterval(shuffle); face(1+Math.floor(Math.random()*6));
    if(d.error) throw new Error(d.error);
    const t=d.track;
    plate.className='plate show';
    pErr.hidden=true;
    pCat.textContent=d.cat;
    pYear.textContent=t.y||''; pYear.hidden=!t.y;
    if(d.have>=0){ pHave.hidden=false; pHave.textContent=d.have+' in the crate'; }
    else pHave.hidden=true;
    pTrack.textContent=t.n; pArtist.textContent=t.a;
    if(t.id && await spPlay(t.id)){
      // playing on their own Spotify device - the embed would only duplicate it
      audio.pause(); audio.hidden=true; player.hidden=true;
    }else if(t.stream){
      // self-hosted backend: real audio, so autoplay is just a play() call
      player.hidden=true; audio.hidden=false;
      audio.src=t.stream;
      audio.play().catch(()=>{});
    }else{
      audio.pause(); audio.hidden=true; player.hidden=false;
      playUri('spotify:track:'+t.id);
    }
  }catch(e){
    clearInterval(shuffle); face(1);
    plate.className='plate show';
    pErr.hidden=false; pErr.textContent='roll failed: '+e.message;
  }finally{ die.classList.remove('rolling'); busy=false; }
}

const recent=[];
function staticRoll(cat){
  if(cat==='any'){
    const ready=Object.keys(STATIC).filter(c=>STATIC[c].length);
    cat=ready[Math.floor(Math.random()*ready.length)];
  }
  const pool=STATIC[cat]||[];
  if(!pool.length) return {error:'nothing indexed for '+cat+' yet'};
  const fresh=pool.filter(t=>!recent.includes(t.id));
  const t=(fresh.length?fresh:pool)[Math.floor(Math.random()*(fresh.length||pool.length))];
  recent.push(t.id); if(recent.length>40) recent.shift();
  return {cat:cat, track:t, have:pool.length};
}

die.onclick=roll;
die.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '||e.code==='Space'){ e.preventDefault(); roll(); }
});
document.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); roll();} });
boot();
</script>
</body>
</html>
